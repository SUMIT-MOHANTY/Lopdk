# ---------------------------------------------------------------------------
# flake8 — style and complexity checks
# ---------------------------------------------------------------------------
[flake8]
max-line-length = 119
exclude =
    .git,
    __pycache__,
    */migrations/*,
    .venv,
    venv,
    env,
    .env,
    build,
    dist,
    staticfiles,
    node_modules
per-file-ignores =
    # Allow star imports in settings files
    config/settings/*.py: F401,F403,F405
    # Allow unused imports in __init__ files
    */__init__.py: F401
ignore =
    # Line break before binary operator (conflicts with Black)
    W503

# ---------------------------------------------------------------------------
# pytest / coverage (mirrors pytest.ini but kept here for tool compatibility)
# ---------------------------------------------------------------------------
[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
addopts =
    --strict-markers
    --tb=short
    -v
testpaths = tests

[coverage:run]
branch = True
source = .
omit =
    */migrations/*
    manage.py
    config/settings/*.py
    .venv/*
    venv/*
    tests/*

[coverage:report]
show_missing = True
skip_covered = False
fail_under = 80
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if TYPE_CHECKING:
