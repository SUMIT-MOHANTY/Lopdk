[pytest]
# Tell pytest-django which settings module to use
DJANGO_SETTINGS_MODULE = config.settings.development

# File / class / function discovery patterns
python_files  = test_*.py *_test.py tests.py
python_classes = Test*
python_functions = test_*

# Default options: verbose output + coverage report
addopts =
    --strict-markers
    --tb=short
    -v

# Test root directories
testpaths = tests

# Custom markers (add more as needed)
markers =
    unit: Pure unit tests with no I/O
    integration: Tests that hit the database or external services
    slow: Tests that take more than a few seconds
