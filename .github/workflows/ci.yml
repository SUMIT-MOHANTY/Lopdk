# ---------------------------------------------------------------------------
# Continuous Integration Pipeline
# Runs on every push and pull-request targeting main / master.
# Steps: install deps → lint (flake8) → test with coverage gating (≥ 80 %)
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  build:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out source
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Python
      # -----------------------------------------------------------------------
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # -----------------------------------------------------------------------
      # 3. Install dependencies
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------------------------------------------------
      # 4. Create a minimal .env so Django settings can load
      # -----------------------------------------------------------------------
      - name: Create .env for CI
        run: |
          echo "SECRET_KEY=ci-only-insecure-secret-key-$(openssl rand -hex 16)" >> .env
          echo "DEBUG=True" >> .env
          echo "ALLOWED_HOSTS=*" >> .env

      # -----------------------------------------------------------------------
      # 5. Lint with flake8
      # -----------------------------------------------------------------------
      - name: Lint with flake8
        run: |
          flake8 . --count --statistics

      # -----------------------------------------------------------------------
      # 6. Run Django system checks
      # -----------------------------------------------------------------------
      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          python manage.py check --settings=config.settings.development

      # -----------------------------------------------------------------------
      # 7. Run tests with coverage gating
      # -----------------------------------------------------------------------
      - name: Run tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          pytest --cov=. --cov-report=term-missing --cov-fail-under=80

      # -----------------------------------------------------------------------
      # 8. Upload coverage report as artifact (optional, non-blocking)
      # -----------------------------------------------------------------------
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: htmlcov/
          if-no-files-found: ignore
