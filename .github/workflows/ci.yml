# ---------------------------------------------------------------------------
# Continuous Integration Pipeline
# Runs on every push and pull-request targeting main / master.
# Steps: install deps → lint (flake8) → Django system check → test with
#        coverage gating (≥ 80 %)
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out source
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Python with pip caching
      # -----------------------------------------------------------------------
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # -----------------------------------------------------------------------
      # 3. Install dependencies
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------------------------------------------------
      # 4. Configure environment variables from repository secrets
      #    SECRET_KEY and DEBUG come from GitHub repository secrets.
      #    ALLOWED_HOSTS is set to a safe CI value.
      # -----------------------------------------------------------------------
      - name: Configure environment variables
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: ${{ secrets.DEBUG }}
        run: |
          # Use secret if available, otherwise generate a safe CI-only key
          CI_SECRET_KEY="${SECRET_KEY:-ci-only-insecure-key-$(openssl rand -hex 20)}"
          CI_DEBUG="${DEBUG:-False}"

          echo "SECRET_KEY=${CI_SECRET_KEY}" >> .env
          echo "DEBUG=${CI_DEBUG}" >> .env
          echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env
          echo "DJANGO_SETTINGS_MODULE=config.settings.development" >> .env

      # -----------------------------------------------------------------------
      # 5. Lint with flake8 — fails pipeline on any style error
      # -----------------------------------------------------------------------
      - name: Lint with flake8
        run: |
          flake8 . --count --statistics

      # -----------------------------------------------------------------------
      # 6. Run Django system checks (development settings for CI)
      # -----------------------------------------------------------------------
      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          python manage.py check --settings=config.settings.development

      # -----------------------------------------------------------------------
      # 7. Run tests with coverage gating — fails if coverage < 80 %
      # -----------------------------------------------------------------------
      - name: Run tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          pytest \
            --cov=. \
            --cov-config=setup.cfg \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-fail-under=80

      # -----------------------------------------------------------------------
      # 8. Upload HTML coverage report as a build artifact
      # -----------------------------------------------------------------------
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: htmlcov/
          if-no-files-found: ignore
